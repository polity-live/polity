# fly.toml — zero-cache on Fly.io
#
# First-time setup:
#   1. fly auth login
#   2. fly apps create polity-zero --machines
#   3. fly volumes create zero_data --region fra --size 1
#   4. fly secrets set \
#        ZERO_UPSTREAM_DB="postgresql://postgres:PASSWORD@db.PROJECT.supabase.co:5432/postgres?sslmode=require" \
#        ZERO_CVR_DB="postgresql://postgres.PROJECT:PASSWORD@aws-1-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require" \
#        ZERO_CHANGE_DB="postgresql://postgres.PROJECT:PASSWORD@aws-1-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require" \
#        ZERO_ADMIN_PASSWORD="your-strong-password" \
#        OTEL_EXPORTER_OTLP_ENDPOINT="https://your-otel-collector.example"
#   5. fly deploy

app = "polity-zero"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.zero"

[env]
  ZERO_PORT = "4848"
  NODE_ENV = "production"

  # Zero 1.8 defaults to 30 CVR connections, 5 change connections, and
  # max(1, available CPU parallelism - 1) sync workers. ZERO_UPSTREAM_DB has a
  # separate default limit of 20 and does not consume this session-pool budget
  # while it continues to use Supabase's direct database connection.
  #
  # ZERO_CVR_DB and ZERO_CHANGE_DB use the same Supabase user + database, so
  # they share Nano's pool_size=15. The 8 + 3 allocation below uses 11 slots
  # and leaves 4 for startup and operational headroom.
  #
  # After increasing the Supabase compute/pool limit, keep roughly:
  #   Fly machines * (CVR_MAX_CONNS + CHANGE_MAX_CONNS) <= 80% of pool_size
  # Example for pool_size=30 and one machine: CVR=20, CHANGE=4. Redeploy Fly
  # after changing these values. Restore Zero's 30 + 5 defaults only with at
  # least 40 available pool connections (and recalculate for multiple machines).
  ZERO_NUM_SYNC_WORKERS = "1"
  ZERO_CVR_MAX_CONNS = "8"
  ZERO_CHANGE_MAX_CONNS = "3"

  # Zero exports its native sync/query/hydration/CVR/replication metrics and
  # traces when OTEL_EXPORTER_OTLP_ENDPOINT is configured as a Fly secret.
  # HTTP instrumentation adds the custom-query API request duration.
  OTEL_SERVICE_NAME = "polity-zero"
  OTEL_NODE_ENABLED_INSTRUMENTATIONS = "http"

[http_service]
  internal_port = 4848
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/keepalive"

[mounts]
  source = "zero_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

[[restart]]
  policy = "on-failure"
  retries = 5
