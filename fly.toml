# fly.toml — zero-cache on Fly.io
#
# First-time setup:
#   1. fly auth login
#   2. fly apps create polity-zero --machines
#   3. fly volumes create zero_data --region fra --size 1
#   4. fly secrets set \
#        ZERO_UPSTREAM_DB="postgresql://postgres:PASSWORD@db.PROJECT.supabase.co:5432/postgres?sslmode=require" \
#        ZERO_CVR_DB="postgresql://postgres.PROJECT:PASSWORD@aws-1-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require" \
#        ZERO_CHANGE_DB="postgresql://postgres.PROJECT:PASSWORD@aws-1-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require" \
#        ZERO_ADMIN_PASSWORD="your-strong-password" \
#        OTEL_EXPORTER_OTLP_ENDPOINT="https://your-otel-collector.example"
#   5. fly deploy

app = "polity-zero"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.zero"

[env]
  ZERO_PORT = "4848"
  NODE_ENV = "production"

  # Zero 1.10 needs at least five ChangeDB connections plus one per sync
  # worker. ZERO_CHANGE_MAX_CONNS no longer limits that usage.
  # CVR and ChangeDB share the same Supabase session pool (currently budgeted
  # at 15): six CVR + at least six ChangeDB leaves three connections of headroom.
  # Recheck actual pool usage, other consumers and machine count before deploying.
  # Upstream replication uses a separate direct database connection.
  ZERO_NUM_SYNC_WORKERS = "1"
  ZERO_CVR_MAX_CONNS = "6"

  # Zero exports its native sync/query/hydration/CVR/replication metrics and
  # traces when OTEL_EXPORTER_OTLP_ENDPOINT is configured as a Fly secret.
  # HTTP instrumentation adds the custom-query API request duration.
  OTEL_SERVICE_NAME = "polity-zero"
  OTEL_NODE_ENABLED_INSTRUMENTATIONS = "http"

[http_service]
  internal_port = 4848
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10m"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/keepalive"

[mounts]
  source = "zero_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

[[restart]]
  policy = "on-failure"
  retries = 5
