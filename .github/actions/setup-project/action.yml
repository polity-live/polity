name: Set up Polity
description: Configure the pinned Node.js and pnpm runtimes and install dependencies.

inputs:
  install:
    description: Install dependencies with the frozen lockfile.
    required: false
    default: "true"
  cache:
    description: Enable the setup-node pnpm cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up pnpm 10.34.6
      uses: pnpm/action-setup@v6.1.0
      with:
        version: 10.34.6
        run_install: false
    - name: Set up Node.js 24.21.0
      uses: actions/setup-node@v7.1.0
      with:
        node-version: 24.21.0
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        cache-dependency-path: pnpm-lock.yaml
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
