name: Agent 1 E2E Promotion

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24.18.0"
  NPM_VERSION: "11.18.0"
  VITE_APP_URL: http://localhost:3000
  VITE_ZERO_CACHE_URL: http://127.0.0.1:4848
  ZERO_UPSTREAM_DB: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  E2E_APP_COMMAND: npm run start:e2e
  E2E_REUSE_SERVER: "0"

jobs:
  same-stack:
    name: Ten repetitions on one stack
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - run: npx playwright install --with-deps chromium
      - name: Build and provision the promotion stack
        run: |
          supabase start
          supabase db reset --local --no-seed
          eval "$(supabase status -o env)"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_DATABASE_URL=$DB_URL"
          } >> "$GITHUB_ENV"
          export VITE_SUPABASE_URL="$API_URL"
          export VITE_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export E2E_DATABASE_URL="$DB_URL"
          npm run build:e2e
      - name: Run ten independent Agent 1 repetitions without retries
        env:
          CI: "1"
          EVIDENCE_FILE: promotion-evidence/agent1-repeat/evidence.json
        run: |
          set -u
          stack_run_id="agent1-repeat-stack-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for iteration in $(seq 1 10); do
            iteration_run_id="agent1-repeat-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${iteration}"
            started_at_ms="$(node -e 'process.stdout.write(String(Date.now()))')"
            set +e
            E2E_RUN_ID="$iteration_run_id" \
              E2E_SHARD="agent1-repeat-${iteration}" \
              PLAYWRIGHT_OUTPUT_DIR="test-results/repeat-${iteration}" \
              PLAYWRIGHT_REPORT_DIR="playwright-report/repeat-${iteration}" \
              npx playwright test --project=chromium-desktop --grep '@agent1-promotion' --workers=1 --retries=0
            exit_code=$?
            set -e
            completed_at_ms="$(node -e 'process.stdout.write(String(Date.now()))')"
            status=passed
            if (( exit_code != 0 )); then status=failed; fi
            node tools/testing/e2e-acceptance-evidence.mjs record \
              --file "$EVIDENCE_FILE" \
              --suite agent1-repeat \
              --iteration "$iteration" \
              --run-id "$iteration_run_id" \
              --stack-run-id "$stack_run_id" \
              --commit-sha "$GITHUB_SHA" \
              --status "$status" \
              --started-at-ms "$started_at_ms" \
              --completed-at-ms "$completed_at_ms" \
              --fresh-stack false \
              --repository "$GITHUB_REPOSITORY" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"
            if (( exit_code != 0 )); then exit "$exit_code"; fi
          done
      - name: Upload same-stack evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent1-promotion-repeat-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            promotion-evidence/
            playwright-report/
            test-results/
      - name: Stop promotion stack
        if: always()
        run: supabase stop --no-backup || true

  fresh-stack:
    name: Fresh stack ${{ matrix.stack }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        stack: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - run: npx playwright install --with-deps chromium
      - name: Build and provision a fresh stack
        run: |
          supabase start
          supabase db reset --local --no-seed
          eval "$(supabase status -o env)"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_DATABASE_URL=$DB_URL"
          } >> "$GITHUB_ENV"
          export VITE_SUPABASE_URL="$API_URL"
          export VITE_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export E2E_DATABASE_URL="$DB_URL"
          npm run build:e2e
      - name: Run Agent 1 suite once without retries
        env:
          CI: "1"
          PROMOTION_STACK: ${{ matrix.stack }}
          EVIDENCE_FILE: promotion-evidence/agent1-cold-stack/stack-${{ matrix.stack }}.json
        run: |
          set -u
          run_id="agent1-cold-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${PROMOTION_STACK}"
          started_at_ms="$(node -e 'process.stdout.write(String(Date.now()))')"
          set +e
          E2E_RUN_ID="$run_id" \
            E2E_SHARD="agent1-cold-${PROMOTION_STACK}" \
            PLAYWRIGHT_OUTPUT_DIR="test-results/cold-${PROMOTION_STACK}" \
            PLAYWRIGHT_REPORT_DIR="playwright-report/cold-${PROMOTION_STACK}" \
            npx playwright test --project=chromium-desktop --grep '@agent1-promotion' --workers=1 --retries=0
          exit_code=$?
          set -e
          completed_at_ms="$(node -e 'process.stdout.write(String(Date.now()))')"
          status=passed
          if (( exit_code != 0 )); then status=failed; fi
          node tools/testing/e2e-acceptance-evidence.mjs record \
            --file "$EVIDENCE_FILE" \
            --suite agent1-cold-stack \
            --iteration "$PROMOTION_STACK" \
            --run-id "$run_id" \
            --stack-run-id "$run_id" \
            --commit-sha "$GITHUB_SHA" \
            --status "$status" \
            --started-at-ms "$started_at_ms" \
            --completed-at-ms "$completed_at_ms" \
            --fresh-stack true \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"
          exit "$exit_code"
      - name: Upload fresh-stack evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent1-promotion-cold-${{ matrix.stack }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            promotion-evidence/
            playwright-report/
            test-results/
      - name: Stop fresh stack
        if: always()
        run: supabase stop --no-backup || true

  promotion-gate:
    name: Agent 1 Promotion Gate
    if: always()
    needs: [same-stack, fresh-stack]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: agent1-promotion-*-${{ github.run_attempt }}
          path: downloaded-promotion
          merge-multiple: true
      - name: Verify ten same-stack and three fresh-stack runs
        run: |
          node tools/testing/e2e-acceptance-evidence.mjs verify \
            --input downloaded-promotion/promotion-evidence/agent1-repeat \
            --output promotion-proof/agent1-repeat.json \
            --suite agent1-repeat \
            --commit-sha "$GITHUB_SHA"
          node tools/testing/e2e-acceptance-evidence.mjs verify \
            --input downloaded-promotion/promotion-evidence/agent1-cold-stack \
            --output promotion-proof/agent1-cold-stack.json \
            --suite agent1-cold-stack \
            --commit-sha "$GITHUB_SHA"
      - name: Require every promotion lane
        env:
          SAME_STACK_RESULT: ${{ needs.same-stack.result }}
          FRESH_STACK_RESULT: ${{ needs.fresh-stack.result }}
        run: |
          if [[ "$SAME_STACK_RESULT" != "success" || "$FRESH_STACK_RESULT" != "success" ]]; then
            echo "Agent 1 promotion failed: repeat=$SAME_STACK_RESULT fresh=$FRESH_STACK_RESULT"
            exit 1
          fi
      - name: Upload verified promotion proof
        uses: actions/upload-artifact@v6
        with:
          name: agent1-promotion-proof-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: promotion-proof/
