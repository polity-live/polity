name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.x"
  NPM_VERSION: "11.18.0"

jobs:
  pipeline-performance:
    name: PR Pipeline P95 (15 minutes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Read recent PR pipeline runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh api
          -H "Accept: application/vnd.github+json"
          -H "X-GitHub-Api-Version: 2022-11-28"
          "/repos/$GH_REPO/actions/workflows/ci.yml/runs?event=pull_request&status=success&per_page=100"
          > "$RUNNER_TEMP/pr-ci-workflow-runs.json"
      - name: Enforce PR pipeline P95
        run: >-
          node tools/testing/check-pr-pipeline-p95.mjs
          --input "$RUNNER_TEMP/pr-ci-workflow-runs.json"
          --threshold-seconds 900
          --min-samples 20
          --max-samples 50

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@${NPM_VERSION}
      - name: Install dependencies
        run: npm ci
      - name: Verify complete test accountability and static audits
        run: npm run test:static
      - name: Enforce exact accountability for changed production surfaces
        run: npm run test:accountability:changed
      - id: format
        name: Changed-file format ratchet
        continue-on-error: true
        run: npm run format:check:changed
      - id: lint
        name: Lint
        continue-on-error: true
        run: npm run lint:check
      - id: typecheck
        name: Typecheck
        continue-on-error: true
        run: npm run typecheck
      - name: Verify static analysis results
        if: always()
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
        run: |
          if [[ "$FORMAT_OUTCOME" != "success" || "$LINT_OUTCOME" != "success" || "$TYPECHECK_OUTCOME" != "success" ]]; then
            echo "Static analysis failed: format=$FORMAT_OUTCOME lint=$LINT_OUTCOME typecheck=$TYPECHECK_OUTCOME"
            exit 1
          fi

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@${NPM_VERSION}
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  component-tests:
    name: Component Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@${NPM_VERSION}
      - name: Install dependencies
        run: npm ci
      - name: Run component integration tests
        run: npm run test:component

  browser-component-tests:
    name: Browser Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser-component

  coverage-shards:
    name: Coverage Shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      COVERAGE_SHARD_MAX_WORKERS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - name: Run isolated instrumented shard
        run: >-
          COVERAGE_SHARD_ARTIFACT_DIR="$RUNNER_TEMP/polity-coverage-shards"
          npm run test:coverage:shard -- "${{ matrix.shard }}/4"
      - name: Upload coverage blob
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-blob-${{ matrix.shard }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: .vitest-reports/blob-${{ matrix.shard }}-4.json
      - name: Upload shard diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: ${{ runner.temp }}/polity-coverage-shards/${{ matrix.shard }}-of-4/

  coverage-ratchet:
    name: Coverage Ratchet
    if: always()
    needs: coverage-shards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful coverage shards
        env:
          COVERAGE_SHARDS_RESULT: ${{ needs.coverage-shards.result }}
        run: |
          if [[ "$COVERAGE_SHARDS_RESULT" != "success" ]]; then
            echo "Coverage shards did not all succeed: $COVERAGE_SHARDS_RESULT"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - name: Download coverage blobs
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-blob-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage-blobs
          merge-multiple: true
      - name: Verify complete shard set
        run: |
          blob_count="$(find "$RUNNER_TEMP/coverage-blobs" -maxdepth 1 -type f -name 'blob-*-4.json' | wc -l)"
          if [[ "$blob_count" -ne 4 ]]; then
            echo "Expected four coverage blobs, received $blob_count"
            exit 1
          fi
      - name: Merge coverage shards
        run: |
          npx vitest \
            --config vitest.coverage.config.ts \
            --merge-reports "$RUNNER_TEMP/coverage-blobs" \
            --coverage \
            "--coverage.reportsDirectory=coverage"
      - name: Enforce repository and changed-code coverage
        run: |
          node tools/testing/check-coverage-ratchet.mjs
          npm run test:coverage:branches:check
          npm run test:coverage:changed
          npm run test:accountability:coverage
      - name: Upload merged coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: coverage/

  security-tests:
    name: Security Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - run: npm run test:security

  service-integration-tests:
    name: Service Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@${NPM_VERSION}
      - name: Install dependencies
        run: npm ci
      - name: Run service integration tests
        run: npm run test:integration

  database-tests:
    name: Database Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@${NPM_VERSION}
      - name: Install dependencies
        run: npm ci
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - name: Disable seed data for database startup
        run: sed -i '/^\[db.seed\]/,/^\[/ s/^enabled = true$/enabled = false/' supabase/config.toml
      - name: Start database
        run: supabase start
      - name: Apply migrations
        run: supabase db reset --local --no-seed
      - name: Lint database
        run: supabase db lint --local --schema public --level warning --fail-on warning
      - name: Verify declarative schemas match migrations
        run: |
          schema_diff="$(supabase db diff --output-format text --agent no)"
          if [[ -n "${schema_diff//[[:space:]]/}" ]]; then
            echo "Declarative schemas and migrations are out of sync:"
            printf '%s\n' "$schema_diff"
            exit 1
          fi
      - name: Verify database coverage
        run: npm run test:db:coverage
      - name: Run pgTAP tests
        run: supabase test db --local
      - name: Run database concurrency tests
        run: |
          database_url="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          if [[ -z "$database_url" ]]; then
            echo "Could not determine the local database URL"
            exit 1
          fi
          SUPABASE_DB_URL="$database_url" npm run test:db:concurrency
      - name: Stop database
        if: always()
        run: supabase stop --no-backup

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@${NPM_VERSION}
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build

  e2e-tests:
    name: E2E / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop-1-of-3
            project: chromium-desktop
            shard: 1/3
            grep: "@pr"
          - name: desktop-2-of-3
            project: chromium-desktop
            shard: 2/3
            grep: "@pr"
          - name: desktop-3-of-3
            project: chromium-desktop
            shard: 3/3
            grep: "@pr"
          - name: mobile-core
            project: chromium-mobile
            shard: ""
            grep: "@pr"
    env:
      CI: "1"
      PLAYWRIGHT_BLOB_REPORT: "1"
      PLAYWRIGHT_BLOB_DIR: blob-report
      E2E_APP_COMMAND: npm run start:e2e
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
      PLAYWRIGHT_OUTPUT_DIR: test-results/${{ matrix.name }}
      VITE_APP_URL: http://localhost:3000
      VITE_ZERO_CACHE_URL: http://127.0.0.1:4848
      ZERO_UPSTREAM_DB: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@${NPM_VERSION}
      - name: Install dependencies
        run: npm ci
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start and reset isolated Supabase stack
        run: |
          supabase start
          supabase db reset --local --no-seed
      - name: Export isolated stack environment
        run: |
          eval "$(supabase status -o env)"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_DATABASE_URL=$DB_URL"
          } >> "$GITHUB_ENV"
      - name: Build production-mode E2E app
        run: npm run build:e2e
      - name: Start with a clean Zero replica
        run: node tools/zero/clean-dev-cache.mjs
      - name: Run isolated E2E partition
        env:
          E2E_PROJECT: ${{ matrix.project }}
          E2E_GREP: ${{ matrix.grep }}
          E2E_SHARD: ${{ matrix.shard }}
        run: |
          args=(--project="$E2E_PROJECT" --grep "$E2E_GREP")
          if [[ -n "$E2E_SHARD" ]]; then
            args+=(--shard="$E2E_SHARD")
          fi
          npx playwright test "${args[@]}"
      - name: Upload first-failure diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-${{ matrix.name }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            test-results/
      - name: Upload shard blob report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-blob-${{ matrix.name }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: blob-report/
      - name: Stop isolated stack
        if: always()
        run: supabase stop --no-backup

  merge-e2e-reports:
    name: Merge E2E Reports
    if: always()
    needs: e2e-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          pattern: e2e-blob-*-${{ github.run_attempt }}
          path: all-blob-reports
          merge-multiple: true
      - name: Merge shard reports
        run: npx playwright merge-reports --reporter html all-blob-reports
      - uses: actions/upload-artifact@v6
        with:
          name: e2e-html-report-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: playwright-report/

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: moderate
