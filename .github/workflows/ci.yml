name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.x"
  NPM_VERSION: "10.9.2"

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@${NPM_VERSION}
      - name: Install dependencies
        run: npm ci
      - id: format
        name: Format
        continue-on-error: true
        run: npm run format:check
      - id: lint
        name: Lint
        continue-on-error: true
        run: npm run lint:check
      - id: typecheck
        name: Typecheck
        continue-on-error: true
        run: npm run typecheck
      - name: Verify static analysis results
        if: always()
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
        run: |
          if [[ "$FORMAT_OUTCOME" != "success" || "$LINT_OUTCOME" != "success" || "$TYPECHECK_OUTCOME" != "success" ]]; then
            echo "Static analysis failed: format=$FORMAT_OUTCOME lint=$LINT_OUTCOME typecheck=$TYPECHECK_OUTCOME"
            exit 1
          fi

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@${NPM_VERSION}
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@${NPM_VERSION}
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
