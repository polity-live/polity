name: "🧪 - Test"
description: Track a single test case or targeted test coverage task
title: "🧪 -"
labels: []
assignees:
  - Donnerstagnacht
projects:
  - polity-live/3
type: Test
body:
- type: textarea
  id: test
  attributes:
    label: Description
    value: |
      ## 🔁 Steps / Scenario
      1. ...
      2. ...
      3. ...

      ## ✅ Expected Assertions
      - [ ] Assertion 1
      - [ ] Assertion 2

      ## 🧩 Notes
      Add technical notes, related routes/components, fixtures, or edge cases here.
- type: checkboxes
  id: execution_type
  attributes:
    label: Execution Type
    description: Select whether this test is intended to be automated or manual.
    options:
      - label: Automated
      - label: Manual
- type: checkboxes
  id: viewports
  attributes:
    label: Viewports
    description: Select the viewports this test should cover.
    options:
      - label: Mobile
      - label: Tablet
      - label: Desktop