allowBuilds:
  '@parcel/watcher': true
  '@rocicorp/zero-sqlite3': true
  esbuild: true
  msw: false
  protobufjs: true
  # sharp is dev-only via React Email/Next and its platform binary is provided
  # through optional dependencies, so its fallback source-build hook stays disabled.
  sharp: false

fetchRetries: 5
fetchRetryFactor: 2
fetchRetryMintimeout: 20000
fetchRetryMaxtimeout: 120000
fetchTimeout: 300000
# Zero 1.x and Radix publish declaration graphs that rely on a flat Node module
# layout. Keep pnpm's canonical lockfile while matching that supported layout.
nodeLinker: hoisted
strictPeerDependencies: true

# Keep only transitive security fixes that the current direct dependency graph
# does not resolve on its own. Re-check these with `pnpm why` on upgrades.
overrides:
  'lodash-es@<4.18.0': 4.18.0
  '@opentelemetry/core@2': 2.10.0
  '@opentelemetry/propagator-jaeger@2': 2.9.0
  qs: 6.16.0
  # React Email pins an older Next.js patch with known development-server advisories.
  '@react-email/ui>next': 16.3.8
  # Watcher 2.6 preserves the native API and replaces the vulnerable braces parser.
  '@tailwindcss/cli>@parcel/watcher': 2.6.0
  uuid: 11.1.1
  'xmlbuilder2@3.1.1>js-yaml': 3.15.2
  'js-yaml@4': 4.3.2
  '@xmldom/xmldom@0.8': 0.8.15
  'fast-uri@3': 3.1.8
  'fast-uri@4': 4.1.5
  'undici@6': 6.28.1
  'undici@7': 7.29.1
  'tinypool@2': 2.1.2
  'brace-expansion@2': 2.1.7
  '@grpc/grpc-js@1': 1.14.5
  'fastify@5': 5.12.5
  'katex@0': 0.18.2
  'source-map-js@1': 1.2.2
  'postcss-selector-parser': 7.1.6
  '@opentelemetry/instrumentation-pg': 0.73.0
  '@opentelemetry/instrumentation-mysql2': 0.67.0
  '@opentelemetry/instrumentation-knex': 0.65.0
  '@opentelemetry/instrumentation-mysql': 0.67.0
  '@opentelemetry/instrumentation-tedious': 0.40.0
  '@opentelemetry/instrumentation-mongoose': 0.67.0
  '@opentelemetry/instrumentation-oracledb': 0.46.0
  '@opentelemetry/instrumentation-cassandra-driver': 0.66.0
  # These CLI-only parsers are compatible with argparse 2, which removes sprintf-js.
  'mammoth>argparse': 2.0.1
  'js-yaml@3>argparse': 2.0.1
  browserslist: 4.28.8
  baseline-browser-mapping: 2.11.18
  # PptxGenJS 4 ships image-size 1 even though its distributed renderer no longer imports it.
  # Keep that transitive package on the parser release with bounded malformed-image handling.
  'pptxgenjs>image-size': 2.0.4
