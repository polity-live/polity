<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Polity email address was changed</title>
  </head>
  <body style="margin: 0; background: #f6f7f8; font-family: Arial, sans-serif; color: #202124">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 560px; background: #ffffff; border: 1px solid #e2e5e9"
          >
            <tr>
              <td style="padding: 28px 32px 8px; font-size: 22px; font-weight: 700">Polity</td>
            </tr>
            <tr>
              <td style="padding: 16px 32px 8px; font-size: 18px; font-weight: 700">
                Your email address was changed
              </td>
            </tr>
            <tr>
              <td style="padding: 8px 32px; line-height: 1.6">
                Your account email was changed from {{ .OldEmail }} to {{ .Email }}.
              </td>
            </tr>
            <tr>
              <td style="padding: 8px 32px 32px; line-height: 1.6">
                If you did not make this change, contact the Polity team immediately.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
