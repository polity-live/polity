  "./schemas/05_2_amendment.sql",
  "./schemas/06_agenda.sql",
  "./schemas/07_blog.sql",
  "./schemas/08_todo.sql",
  "./schemas/09_message.sql",
  "./schemas/10_notification.sql",
  "./schemas/11_statement.sql",
  "./schemas/12_payment.sql",
  "./schemas/14_change_request.sql",
  "./schemas/15_discussion.sql",
  "./schemas/16_position_election.sql",
  "./schemas/18_delegate.sql",
  "./schemas/20_0_amendment_vote.sql",
  "./schemas/20_1_amendment_choices_vote.sql",
  "./schemas/20_5_agenda_item_change_request.sql",
  "./schemas/21_common.sql",
  "./schemas/21_search_document.sql",
  "./schemas/22_functions.sql",
  "./schemas/23_appearance_theme.sql",
  "./schemas/24_user_preference.sql",
  "./schemas/25_currency.sql",
  "./schemas/26_voting_password.sql",
  "./schemas/27_accreditation.sql",
  "./schemas/28_ai.sql",
  "./schemas/29_pql_filter.sql",
  "./schemas/30_datasets.sql",
  "./schemas/32_newsletter.sql",
  "./schemas/33_app_tutorial.sql",
  "./schemas/36_communication_studio.sql",
  "./schemas/49_studio_zero.sql",
  "./schemas/50_studio_editor_actions.sql",
  "./schemas/54_canvas_workflows.sql",
  "./schemas/55_canvas_capabilities.sql",
  "./schemas/56_canvas_authority_lock.sql",
  "./schemas/59_canvas_zero_workspaces.sql",
  "./schemas/63_studio_v4_themes_elements.sql",
