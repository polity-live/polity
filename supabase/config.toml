[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.production.sql", "./seed.local.sql"]

[db.pooler]
enabled = false

[db.settings]
max_connections = 200


[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/reset-password"]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.email.template.confirmation]
subject = '{{ if eq .Data.language `de` }}Bestätige deine E-Mail-Adresse für Polity{{ else }}Confirm your email address for Polity{{ end }}'
content_path = "./supabase/email-templates/confirm-signup.html"

[auth.email.template.invite]
subject = '{{ if eq .Data.language `de` }}Du wurdest zu Polity eingeladen{{ else }}You have been invited to Polity{{ end }}'
content_path = "./supabase/email-templates/invite.html"

[auth.email.template.magic_link]
subject = '{{ if eq .Data.language `de` }}{{ .Token }} ist dein Polity-Anmeldecode{{ else }}{{ .Token }} is your Polity sign-in code{{ end }}'
content_path = "./supabase/email-templates/magic-link.html"

[auth.email.template.email_change]
subject = '{{ if eq .Data.language `de` }}Bestätige deine neue E-Mail-Adresse für Polity{{ else }}Confirm your new email address for Polity{{ end }}'
content_path = "./supabase/email-templates/confirm-email-change.html"

[auth.email.template.recovery]
subject = '{{ if eq .Data.language `de` }}Setze dein Polity-Passwort zurück{{ else }}Reset your Polity password{{ end }}'
content_path = "./supabase/email-templates/reset-password.html"

[auth.email.template.reauthentication]
subject = '{{ if eq .Data.language `de` }}{{ .Token }} ist dein Polity-Bestätigungscode{{ else }}{{ .Token }} is your Polity verification code{{ end }}'
content_path = "./supabase/email-templates/reauthentication.html"

[auth.email.notification.password_changed]
enabled = true
subject = '{{ if eq .Data.language `de` }}Dein Polity-Passwort wurde geändert{{ else }}Your Polity password was changed{{ end }}'
content_path = "./email-templates/password-changed.html"

[auth.email.notification.email_changed]
enabled = true
subject = '{{ if eq .Data.language `de` }}Deine Polity-E-Mail-Adresse wurde geändert{{ else }}Your Polity email address was changed{{ end }}'
content_path = "./email-templates/email-changed.html"

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.vector]
enabled = false

[storage.buckets.avatars]
public = true
file_size_limit = "5MB"
allowed_mime_types = ["image/png", "image/jpeg", "image/gif", "image/webp", "image/svg+xml"]

[storage.buckets.uploads]
public = true
file_size_limit = "50MB"
allowed_mime_types = ["image/png", "image/jpeg", "image/gif", "image/webp", "image/svg+xml", "video/mp4", "video/webm", "video/quicktime", "application/pdf"]

[storage.buckets.dataset-snapshots]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["text/csv", "text/tab-separated-values", "text/plain", "application/vnd.ms-excel"]

[analytics]
enabled = true
port = 54327
vector_port = 54328
backend = "postgres"
